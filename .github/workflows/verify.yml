name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_DB: water_metering
          POSTGRES_PASSWORD: local-ci-admin-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d water_metering" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: water_metering
      POSTGRES_PASSWORD: local-ci-admin-password
      APP_MIGRATE_PASSWORD: local-ci-migration-password
      APP_RW_PASSWORD: local-ci-runtime-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:setup && npm run db:migrate && npm run db:check
      - run: node --import tsx tools/bench/prepare.ts && POSTGRES_DB=water_metering_bench npm run db:setup && POSTGRES_DB=water_metering_bench npm run db:migrate
      - run: npm run verify
      - run: npm audit --audit-level=high
